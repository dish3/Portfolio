name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Next.js 14)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi


      - name: Typecheck Shared Packages
        run: |
          npm run typecheck --workspace=packages/types --if-present
          npm run typecheck --workspace=packages/config --if-present

      - name: Lint Frontend
        run: npm run lint --workspace=apps/web

      - name: Typecheck Frontend
        run: npm run typecheck --workspace=apps/web

      - name: Build Frontend
        env:
          NEXT_PUBLIC_APP_URL: "https://portfolio.os"
          NEXT_PUBLIC_API_URL: "https://api.portfolio.os"
          NEXT_PUBLIC_SITE_NAME: "NOVA OS"
        run: npm run build --workspace=apps/web

  backend:
    name: Backend (FastAPI Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint with Ruff
        run: ruff check apps/api tests/

      - name: Run Backend Tests
        env:
          ENVIRONMENT: "test"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/nova_test"
          ADMIN_API_KEY: "test_admin_key"
          INTERNAL_POLL_SECRET: "test_poll_secret"
        run: pytest tests/api/ -v
